<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/transparent-image.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <script>
    (function () {
      const saved = localStorage.getItem('revora-theme')
      const isDark = saved !== null ? saved === 'dark' : true
      if (isDark) document.documentElement.classList.add('dark')
    })()
  </script>

  <title>PihitWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
